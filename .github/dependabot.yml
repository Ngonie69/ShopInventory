version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Africa/Harare"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "deps"
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    ignore:
      # ImageSharp 4.x requires a paid Six Labors licence key at build time and
      # fails the build without one ("No Six Labors license found"). 3.1.x stays
      # under the Apache-2.0 option. Patch and minor 3.x updates still come
      # through, so security fixes are not blocked.
      - dependency-name: "SixLabors.ImageSharp"
        update-types:
          - "version-update:semver-major"
      # Quartz 4 is a breaking major: IJob.Execute gains a CancellationToken,
      # Quartz.Impl.Matchers and IServiceCollectionQuartzConfigurator move, and
      # every job plus the clustered ADO store config has to be migrated. Take
      # that on as its own change, not inside a weekly grouped bump.
      - dependency-name: "Quartz*"
        update-types:
          - "version-update:semver-major"
      # The projects target net10.0, and the Microsoft servicing packages move
      # as one train (scripts/Set-AlignedPackageVersion.ps1). The 11.x majors
      # cannot all follow: EF Core and the ASP.NET Core packages 11 need net11.0,
      # so Dependabot bumps only the ones that still restore on net10.0 and
      # leaves the train split, with 11.0 assemblies shadowing the 10.0 shared
      # framework. Serilog.AspNetCore 11 and Caching.Hybrid 11 pull in the
      # Microsoft.Extensions 11 packages the same way. Moving to .NET 11 is its
      # own change: retarget, then move every one of these together.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Microsoft.Extensions.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "System.*"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "dotnet-ef"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "Serilog.AspNetCore"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Africa/Harare"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "ci"
    groups:
      # init and analyze must run the same CodeQL version ("Loaded a
      # configuration file for version X, but running version Y"), so they
      # have to move in one PR.
      codeql-action:
        patterns:
          - "github/codeql-action*"
