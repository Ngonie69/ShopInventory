name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Scoped to the test project and what it references. The whole solution is already compiled
      # by the CodeQL workflow, so building it again here would only slow the run down.
      - name: Restore test project
        run: dotnet restore ShopInventory.Tests/ShopInventory.Tests.csproj

      # ShopInventory.IntegrationTests is deliberately left out: every test in it is gated on a
      # reachable SAP Service Layer, so on a runner the whole project reports green by skipping.
      - name: Run tests
        run: >-
          dotnet test ShopInventory.Tests/ShopInventory.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

  # Checks API.md, ApiExplorer.razor and the Web README against the controllers, both directions:
  # a documented endpoint no route serves, and a route nothing documents. Both fail.
  #
  # A wrong path is worth failing on because it usually still *resolves* - a bogus segment binds to
  # a {param} route on the same controller and answers a polite domain 404 that reads like data. An
  # undocumented one is worth failing on because the only moment anyone reliably knows a route
  # exists is the moment it is written down; adding an endpoint here means adding it to API.md, and
  # running scripts/Update-ApiExplorerCatalogue.ps1 for the explorer.
  #
  # No .NET here on purpose: the check parses the controllers as text and needs nothing built.
  catalogues:
    name: Route catalogues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pwsh is preinstalled on the GitHub-hosted ubuntu images. The explicit exit is not
      # decoration: the script signals drift through its exit code, and relying on that code
      # surviving a nested .ps1 invocation is exactly the kind of assumption this job exists to
      # stop making.
      - name: Check the route catalogues against the controllers
        shell: pwsh
        run: |
          ./scripts/Test-RouteCatalogues.ps1
          exit $LASTEXITCODE

  # Update-Production.ps1 grew switches so the deploy workflow can run it with no console attached.
  # Breaking them fails nothing here that anyone would notice - it hangs a production deployment on
  # a credential prompt, or reports a dead site as deployed. So it gets its own check.
  #
  # windows-latest rather than ubuntu because the credential file is DPAPI-sealed, which only means
  # anything on Windows - and Windows is the only place this script ever runs.
  deploy-script:
    name: Deploy script contract
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check the unattended deployment path still holds
        shell: pwsh
        run: |
          ./scripts/Test-DeployCredentialHandling.ps1
          exit $LASTEXITCODE
