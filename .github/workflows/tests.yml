name: Tests

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      # The whole solution, not just the test project: CodeQL no longer compiles anything, so this is
      # the only CI job that proves scripts/ and ShopInventory.IntegrationTests still build.
      - name: Restore solution
        run: dotnet restore ShopInventory.sln

      - name: Build solution
        run: dotnet build ShopInventory.sln --configuration Release --no-restore

      # ShopInventory.IntegrationTests is compiled above but deliberately not run: every test in it is
      # gated on a reachable SAP Service Layer, so on a runner the whole project reports green by skipping.
      - name: Run tests
        run: >-
          dotnet test ShopInventory.Tests/ShopInventory.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ runner.temp }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: ${{ runner.temp }}/test-results
          if-no-files-found: warn

  # Checks API.md, ApiExplorer.razor and the Web README against the controllers, both directions:
  # a documented endpoint no route serves, and a route nothing documents. Both fail.
  #
  # A wrong path is worth failing on because it usually still *resolves* - a bogus segment binds to
  # a {param} route on the same controller and answers a polite domain 404 that reads like data. An
  # undocumented one is worth failing on because the only moment anyone reliably knows a route
  # exists is the moment it is written down; adding an endpoint here means adding it to API.md, and
  # running scripts/Update-ApiExplorerCatalogue.ps1 for the explorer.
  #
  # No .NET here on purpose: the check parses the controllers as text and needs nothing built.
  catalogues:
    name: Route catalogues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pwsh is preinstalled on the GitHub-hosted ubuntu images. The explicit exit is not
      # decoration: the script signals drift through its exit code, and relying on that code
      # surviving a nested .ps1 invocation is exactly the kind of assumption this job exists to
      # stop making.
      - name: Check the route catalogues against the controllers
        shell: pwsh
        run: |
          ./scripts/Test-RouteCatalogues.ps1
          exit $LASTEXITCODE

  # The production runner publishes with an older .NET 10 SDK than developers and this CI use, and its
  # Razor parser rejects two constructs the newer one accepts. Nothing here compiles with that SDK, so
  # without this a page that builds green everywhere fails only at the production publish - which is
  # how a switch expression and a loop variable named `section` held production back for a day.
  # See scripts/check_razor_parser_hazards.py for the constructs and the evidence behind them.
  #
  # No .NET here on purpose: the check reads the .razor files as text.
  razor-parser:
    name: Razor parser hazards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check Razor the production runner cannot compile
        run: python3 scripts/check_razor_parser_hazards.py

  # Update-Production.ps1 grew switches so the deploy workflow can run it with no console attached.
  # Breaking them fails nothing here that anyone would notice - it hangs a production deployment on
  # a credential prompt, or reports a dead site as deployed. So it gets its own check.
  #
  # windows-latest rather than ubuntu because the credential file is DPAPI-sealed, which only means
  # anything on Windows - and Windows is the only place this script ever runs.
  deploy-script:
    name: Deploy script contract
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the unattended deployment path still holds
        shell: pwsh
        run: |
          ./scripts/Test-DeployCredentialHandling.ps1
          exit $LASTEXITCODE

      # The Firebase key is gitignored, so the runner's package never has it. Losing the carry-over
      # fails nothing either - it publishes an API whose push notifications are silently dead.
      - name: Check a deployment keeps the API's Firebase key
        shell: pwsh
        run: |
          ./scripts/Test-DeploySlotSeeding.ps1
          exit $LASTEXITCODE

      # A merge waits for the evening because a cutover drops the requests in flight, and nobody could
      # say how many. The probe answers that, so it has to be right in the one direction that matters:
      # a probe that quietly reported zero would be believed, and would be used to argue for deploying
      # while the shops are open. This also fails if the binding swap itself is edited here - that
      # change belongs on its own evidence, having taken the Web down for four minutes once already.
      - name: Check the cutover probe measures what it claims to
        shell: pwsh
        run: |
          ./scripts/Test-DeployCutoverProbe.ps1
          exit $LASTEXITCODE
